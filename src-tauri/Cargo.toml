[package]
name = "anishelf"
version = "1.0.0"
description = "Anime library manager"
authors = ["Mohamad Mahdi Shafie"]
license = "MIT"
repository = "https://github.com/yourusername/AniShelf"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open", "dialog-all", "fs-all", "path-all", "window-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["time", "fs", "io-util"] }
dirs = "5"
smb2 = "0.10"
base64 = "0.21"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
